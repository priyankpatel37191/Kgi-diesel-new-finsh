workflows:
  kgi-diesels-debug-build:
    name: KGI Diesels - Debug APK Build
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      java: 21
      vars:
        PACKAGE_NAME: "com.aistudio.kgidiesels.lpqtvr"
    scripts:
      - name: Ensure debug keystore exists (required for signing config in build.gradle.kts)
        script: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore missing - generating standard Android debug keystore"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Set executable permission for gradlew
        script: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi
      - name: Generate Gradle wrapper if missing
        script: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.9
            chmod +x ./gradlew
          fi
      - name: Build debug APK
        script: ./gradlew assembleDebug --stacktrace
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/**/*.aab
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
