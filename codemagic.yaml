workflows:
  kgi-diesels-debug-build:
    name: KGI Diesels - Debug APK Build
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      java: 21
      vars:
        PACKAGE_NAME: "com.aistudio.kgidiesels.lpqtvr"
        GRADLE_VERSION: "9.3.1"
    scripts:
      - name: Ensure .env / .env.example exist (required by secrets-gradle-plugin)
        script: |
          if [ ! -f "./.env.example" ]; then
            echo "Creating missing .env.example placeholder"
            cat > .env.example << 'EOF'
          GEMINI_API_KEY=MY_GEMINI_API_KEY
          GOOGLE_CLOUD_API_KEY=MY_GOOGLE_CLOUD_API_KEY
          EOF
          fi
          if [ ! -f "./.env" ]; then
            echo "Creating .env from .env.example (no real secrets needed for a debug build)"
            cp .env.example .env
          fi

      - name: Ensure debug keystore exists (required by build.gradle.kts signing config)
        script: |
          if [ ! -f "./debug.keystore" ]; then
            echo "debug.keystore missing - generating standard Android debug keystore"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure real Gradle wrapper files exist
        script: |
          if [ ! -f "./gradlew" ] || [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper missing - fetching official wrapper files for Gradle $GRADLE_VERSION"
            mkdir -p gradle/wrapper

            curl -sL -o gradlew "https://raw.githubusercontent.com/gradle/gradle/v$GRADLE_VERSION/gradlew"
            curl -sL -o gradlew.bat "https://raw.githubusercontent.com/gradle/gradle/v$GRADLE_VERSION/gradlew.bat"
            curl -sL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v$GRADLE_VERSION/gradle/wrapper/gradle-wrapper.jar"

            cat > gradle/wrapper/gradle-wrapper.properties << EOF
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

            chmod +x gradlew
          else
            echo "Gradle wrapper already present - using committed version"
            chmod +x gradlew
          fi

      - name: Build debug APK
        script: ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
